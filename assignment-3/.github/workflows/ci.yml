name: CI

on:
  pull_request:
    branches: [assignment-3]
    paths:
    - 'assignment-3/**'
  push:
    branches: [assignment-3]
    paths:
      - 'assignment-3/**'

jobs:
  dependency-audit:
    name: Dependency audit (high severity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assignment-3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: assignment-3/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (fails on high or critical advisories)
        run: npm audit --audit-level=high
